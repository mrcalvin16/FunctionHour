name: Deploy Convex Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "convex/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-convex.yml"

concurrency:
  group: convex-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Deploy Convex production backend
        run: npx convex deploy --message "GitHub Actions ${GITHUB_SHA}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Add this batch only on commits that change its importer; never reset older demos.
      - name: Import seasonal demo event batch when changed
        if: github.event_name == 'push'
        run: |
          if [ -f convex/seasonalDemoEvents.ts ] && ! git diff --quiet HEAD^ HEAD -- convex/seasonalDemoEvents.ts; then
            npx convex run --prod seasonalDemoEvents:seed '{}'
          fi
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
